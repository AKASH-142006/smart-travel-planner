<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Travel Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page-container {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .auth-image {
      flex: none;
      height: 300px;
      width: 100%;
      background: url('https://images.unsplash.com/photo-1526772662000-3f88f10405ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=2560&q=100') center center / cover no-repeat;
      display: block;
    }
    .auth-form-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    @media (min-width: 768px) {
      .auth-page-container {
        flex-direction: row;
        align-items: stretch;
      }
      .auth-image {
        flex: 1.2;
        height: auto;
        min-height: 100%;
      }
    }
    .auth-box {
      max-width: 480px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }
    .auth-box h2 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }
    .auth-box p.subtext {
      font-size: 16px !important;
      margin-bottom: 24px !important;
      line-height: 1.5;
    }
    .auth-box label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin: 20px 0 8px;
    }
    .auth-box input {
      width: 100%;
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s;
    }
    .auth-box input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0, 140, 255, 0.15);
    }
    .auth-box .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 15px;
      color: var(--muted);
    }
    .auth-box .auth-footer a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }
    .auth-box .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner" style="max-width:1100px;">
    <a href="index.html" class="brand-group">
      <span class="brand-logo">🧭</span>
      <div class="brand-text">
        <h1>Smart Travel Planner</h1>
        <p>Inspiring Your Next Journey</p>
      </div>
    </a>
    <a href="index.html" class="btn secondary small" style="background:rgba(255,255,255,0.15); color:white; border:none;">Explore Trips →</a>
  </div>
</header>

<div class="auth-page-container">
  <div class="auth-image"></div>
  <div class="auth-form-wrapper">
    <div class="auth-box">
    <h2>Welcome Back</h2>
    <p class="subtext" style="color:var(--muted); font-size:14px; margin-bottom:18px;">Log in to access your itinerary, MySQL profile, and budget calculations.</p>

    <label>Email Address</label>
    <input id="loginEmail" type="email" placeholder="you@example.com">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Enter your password">

    <button class="btn" style="width:100%; margin-top:28px; padding:16px; font-size:16px; border-radius:10px; font-weight:700;" onclick="handleLogin()">Login to Account</button>
    <div id="loginMsg" class="msg"></div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one here</a>
    </div>
  </div>
  </div>
</div>

<script>
  const API_BASE = '/api';
  const SESSION_KEY = "stp_session";

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "msg show " + type;
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value;

    if (!email || !pass) return showMsg('loginMsg', "Please enter email and password.", "error");

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();

      if (!res.ok) {
        return showMsg('loginMsg', data.error || "Invalid email or password.", "error");
      }

      data.user.apiToken = data.token;
      localStorage.setItem(SESSION_KEY, JSON.stringify(data.user));
      // Remove legacy shared key so no previous account's plans bleed into this session
      localStorage.removeItem('stp_saved_plans');
      showMsg('loginMsg', "Login successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);
    } catch (err) {
      console.warn("Backend API offline, checking localStorage fallback:", err);
      const users = JSON.parse(localStorage.getItem("stp_users") || "{}");
      if (!users[email] || users[email].pass !== pass) {
        return showMsg('loginMsg', "Invalid email or password.", "error");
      }
      localStorage.setItem(SESSION_KEY, JSON.stringify(users[email]));
      // Remove legacy shared key so no previous account's plans bleed into this session
      localStorage.removeItem('stp_saved_plans');
      showMsg('loginMsg', "Login successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);
    }
  }

  // Allow pressing Enter to submit
  document.getElementById('loginPassword').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
